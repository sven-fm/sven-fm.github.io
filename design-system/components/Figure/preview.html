<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:var(--pine);font-family:var(--font-text);padding:28px 40px;-webkit-font-smoothing:antialiased}
  .g{display:grid;grid-template-columns:repeat(3,1fr);gap:48px}
  figure{margin:0;border-top:1px solid var(--sage-rule);padding-top:24px}
  .v{display:block;font:600 84px/.92 var(--font-display);letter-spacing:-.055em;color:var(--sage);font-variant-numeric:tabular-nums}
  figcaption{margin-top:16px;max-width:27ch;font-size:15px;line-height:1.5;color:var(--sage-muted)}
</style></head><body>
<div class="g">
  <figure><span class="v">60%+</span><figcaption>of Spotify's subscriber growth came from the Global Growth team I led</figcaption></figure>
  <figure><span class="v">$1B+</span><figcaption>in Spotify subscription revenue under my responsibility</figcaption></figure>
  <figure><span class="v">20M+</span><figcaption>monthly active users across Yousician and GuitarTuna as CEO</figcaption></figure>
</div>
</body></html>
