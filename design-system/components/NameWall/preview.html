<!-- @dsCard group="Content" height=230 subtitle="Investments wall, one name hovered" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:var(--paper);font-family:var(--font-text);padding:32px 40px;-webkit-font-smoothing:antialiased}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:.18em .62em;font:600 40px/1.14 var(--font-display);letter-spacing:-.035em;color:var(--ink)}
  a{color:inherit;text-decoration:none;display:inline-flex;align-items:flex-start;gap:.2em;transition:opacity .52s cubic-bezier(.16,1,.3,1)}
  sup{font:600 10.5px/1 var(--font-text);letter-spacing:.12em;text-transform:uppercase;color:var(--brass-ink);transform:translateY(.55em)}
  ul.dim a:not(.on){opacity:.26}
  @media (hover:hover){ul:has(a:hover) a:not(:hover){opacity:.26}}
</style></head><body>
<ul class="dim">
  <li><a href="#">Alba</a></li><li><a href="#">Amie</a></li><li><a href="#">Born</a></li>
  <li><a href="#">Butter<sup>Exit</sup></a></li><li><a href="#">Komi</a></li><li><a href="#" class="on">Melotech</a></li>
  <li><a href="#">Peec</a></li><li><a href="#">Petli<sup>Exit</sup></a></li><li><a href="#">Voicy</a></li>
</ul>
<script>const u=document.querySelector('ul');u.addEventListener('pointerenter',()=>u.classList.remove('dim'));document.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>e.preventDefault()))</script>
</body></html>
