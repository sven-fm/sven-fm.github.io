<!DOCTYPE html>
<!-- Share image for sven.fm (1200x630). Render: node design/tools/render-og.js -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  /* styles.css points at /assets/fonts, which file:// cannot resolve; load the same files relatively. */
  @font-face { font-family: "Funnel Display"; src: url("../../assets/fonts/funnel-display-latin-600-800.woff2") format("woff2"); font-weight: 600 800; }
  @font-face { font-family: "Host Grotesk"; src: url("../../assets/fonts/host-grotesk-latin-300-700.woff2") format("woff2"); font-weight: 300 700; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { display: grid; grid-template-columns: 500px 1fr; width: 1200px; height: 630px; }
  .og__panel { position: relative; overflow: hidden; background: var(--panel); color: var(--panel-ink); padding: 48px; display: flex; flex-direction: column; justify-content: space-between; }
  .og__panel img { position: absolute; top: -8%; left: 0; height: 92%; width: auto; transform: translateX(-36%); }
  .og__panel > p { position: relative; }
  .og__meter { position: absolute; top: 0; right: 0; width: 6px; height: 100%; background: var(--signal); }
  .og__word { font: var(--w-bold) 26px / 1 var(--font-display); letter-spacing: var(--tr-heading); }
  .og__name { font: var(--w-black) 112px / var(--lh-name) var(--font-display); letter-spacing: var(--tr-display); }
  .og__page { background: var(--page); color: var(--ink); padding: 64px 56px 48px; display: flex; flex-direction: column; justify-content: space-between; }
  .og__title { font: var(--w-black) 76px / var(--lh-display) var(--font-display); letter-spacing: var(--tr-display); }
  .og__scope { margin-top: 28px; font-size: 28px; line-height: 1.3; color: var(--ink-2); }
  .og__foot { display: flex; justify-content: space-between; align-items: center; font-size: 24px; color: var(--ink-2); }
  .og__cta { background: var(--signal); color: var(--on-signal); font: var(--w-bold) 26px / 1 var(--font-display); padding: 20px 28px; }
</style>
</head>
<body>
<div class="og">
  <div class="og__panel">
    <img src="../../assets/img/sven-portrait-848.webp" alt="" />
    <div class="og__meter"></div>
    <p class="og__word">sven.fm</p>
    <p class="og__name">Sven<br>Ahrens</p>
  </div>
  <div class="og__page">
    <div>
      <p class="og__title">Fractional COO &amp; Chief Growth Officer</p>
      <p class="og__scope">For consumer companies, $5M to $200M run rate. Spotify, Yousician, Bain. Berlin.</p>
    </div>
    <div class="og__foot"><span>Up to two companies at a time</span><span class="og__cta">Book a call</span></div>
  </div>
</div>
</body>
</html>
