<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>sven.fm — app icon</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Source for favicon.ico, /assets/favicon-*.png, /assets/icon-*.png and
       /apple-touch-icon.png. The mark is the wordmark's S in Syne 800.

       ?variant=brass  brass field, pine S  (shipped — brightest in a tab strip)
       ?variant=pine   pine field, brass S  (the field inverted)
       ?tight=1        fills the tile harder, for 16–48px
       ?fillw= ?fillh= override the fill fractions when tuning

       Render with: node design-system/render-assets.mjs  (see the README) -->
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { display: grid; place-items: center; }

    .tile {
      position: relative; width: 100%; height: 100%;
      display: grid; place-items: center; overflow: hidden;
      background: var(--brass-button);
      color: var(--surface-pine);
    }
    /* Same top highlight the buttons carry, so the icon reads as pressed metal. */
    .tile::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 6% 0 rgba(255,255,255,.4), inset 0 -6% 0 rgba(0,0,0,.10);
    }
    body[data-variant="pine"] .tile { background: var(--surface-pine); color: var(--brass); }
    body[data-variant="pine"] .tile::after {
      box-shadow: inset 0 0 0 1px rgba(220,228,210,.10);
      background: radial-gradient(120% 100% at 30% 8%, rgba(208,169,40,.20), rgba(208,169,40,0) 62%);
    }

    /* The glyph is painted into a canvas so it can be placed by its real ink
       box: a CSS line box would leave the S sitting high, and at 16px half a
       pixel of drift is visible. */
    .s { position: relative; z-index: 1; display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="tile"><canvas class="s"></canvas></div>
  <script>
    var q = new URLSearchParams(location.search);
    var variant = q.get("variant") || "brass";
    var tight = q.get("tight") === "1";       // 16–48px: fill the tile harder
    document.body.dataset.variant = variant;
    document.body.dataset.tight = tight ? "1" : "0";

    // How much of the tile the ink fills. Small icons run as large as the
    // glyph allows: scaling the S up widens its counters in absolute pixels,
    // so Syne 800 keeps its character at 16px instead of needing a lighter
    // weight. Syne's S is ~1.45x as wide as it is tall, so width is the
    // binding constraint and the vertical air is the glyph's own proportion.
    // At 1.0 the S touches the tile edge, so 0.95 is the practical ceiling.
    var FILL_W = +q.get("fillw") || (tight ? 0.95 : 0.86);
    var FILL_H = +q.get("fillh") || (tight ? 0.99 : 0.80);

    // Canvas does not trigger a webfont load the way rendered text does, so
    // ask for the face explicitly before measuring — otherwise measureText
    // silently reports a fallback serif.
    document.fonts.load('800 400px Syne').then(function () {
      if (!document.fonts.check('800 400px Syne')) throw new Error('Syne did not load');
      var cv = document.querySelector(".s");
      var tile = document.querySelector(".tile").getBoundingClientRect();
      var W = tile.width, H = tile.height;
      var dpr = window.devicePixelRatio || 1;

      cv.width = Math.round(W * dpr);
      cv.height = Math.round(H * dpr);
      var cx = cv.getContext("2d");
      cx.scale(dpr, dpr);

      var PROBE = 400;
      cx.font = "800 " + PROBE + "px Syne";
      var m = cx.measureText("S");
      var inkH = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
      var inkW = m.actualBoundingBoxRight + m.actualBoundingBoxLeft;

      var size = Math.min(PROBE * (W * FILL_W) / inkW, PROBE * (H * FILL_H) / inkH);
      var k = size / PROBE;

      cx.font = "800 " + size + "px Syne";
      cx.fillStyle = variant === "pine" ? "#D0A928" : "#13291F";
      // fillText places the baseline; offset so the ink box lands centred.
      cx.fillText("S",
        (W - inkW * k) / 2 + m.actualBoundingBoxLeft * k,
        (H - inkH * k) / 2 + m.actualBoundingBoxAscent * k);

      document.documentElement.dataset.ready = "1";
    });
  </script>
</body>
</html>
