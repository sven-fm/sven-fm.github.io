<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>sven.fm · Open Graph card</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Source for /assets/og.jpg (1200x630). Same composition as the hero:
       night stage, portrait dissolving in from the right, the name in Syne.
       Render with: node design-system/render-assets.mjs -->
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative; background: radial-gradient(120% 90% at 80% 40%, #0B1711, var(--night) 60%);
      color: var(--sage); font-family: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .photo {
      position: absolute; top: 0; right: 0; bottom: 0; width: 600px;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 45%), linear-gradient(to top, transparent 0%, #000 30%);
      -webkit-mask-composite: source-in;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 16%; filter: saturate(.92) contrast(1.04); }
    .mark { position: absolute; left: 72px; top: 60px; display: flex; align-items: center; gap: 12px;
      font: 700 26px/1 var(--display); letter-spacing: -.02em; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brass); box-shadow: 0 0 14px var(--brass-glow); }
    .text { position: absolute; left: 72px; bottom: 70px; }
    .kicker { display: flex; align-items: center; gap: 14px; font: 500 17px/1 var(--text);
      letter-spacing: .18em; text-transform: uppercase; color: var(--brass); margin-bottom: 26px; }
    .kicker::before { content: ""; width: 36px; height: 1.5px; background: currentColor; }
    h1 { font: 700 140px/.84 var(--display); letter-spacing: -.05em; margin-left: -6px; }
    p { margin-top: 30px; font-size: 25px; line-height: 1.35; color: var(--sage-body); }
  </style>
</head>
<body>
  <figure class="photo"><img src="/assets/sven.jpg" alt=""></figure>
  <div class="mark"><span class="dot"></span>sven.fm</div>
  <div class="text">
    <div class="kicker">Berlin</div>
    <h1>Sven<br>Ahrens</h1>
    <p>Consumer growth leader and AI tinkerer.<br>Previously Spotify, Yousician and Bain.</p>
  </div>
</body>
</html>
